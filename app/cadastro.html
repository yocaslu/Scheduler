<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro do cidadão</title><link rel="stylesheet" href="style.css">
</head>
<body><div class="container">
<div class="top"><div class="left-top"><img src="../images.jpg" alt="Logo"></div><div class="center-top"><h2>Cadastro do cidadão</h2></div><div class="right-top"></div></div>
<p>Crie sua conta para acompanhar seus agendamentos.</p>
<form id="formCadastro">
<label for="nome">Nome completo:</label><input id="nome" required maxlength="150">
<label for="email">E-mail:</label><input id="email" type="email" autocomplete="email" required maxlength="255">
<label for="telefone">Telefone:</label><input id="telefone" maxlength="30" autocomplete="tel">
<label for="senha">Senha:</label><input id="senha" type="password" autocomplete="new-password" minlength="6" required>
<label for="cep">CEP:</label><input id="cep" maxlength="20">
<label for="endereco">Endereço:</label><input id="endereco" maxlength="255">
<button type="submit">Criar conta</button>
<div id="mensagem"></div>
</form>
<hr><button type="button" onclick="location.href='/'">Voltar para o login</button>
</div>
<script type="module" src="js/cadastro.js"></script></body></html>

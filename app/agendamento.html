<!DOCTYPE html>
<html lang="pt-BR"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <title>Novo atendimento</title><link rel="stylesheet" href="style.css"></head>
<body><div class="container">
<div class="top">  <div class="left-top">
    <img src="../images.jpg" alt="Logo"></div>
    <div class="center-top"><h2>Novo atendimento</h2></div>

</div>
<p id="boasVindas">Carregando seus dados...</p>
<form id="formAgendamento">
  <label for="motivo">Motivo do atendimento:</label><textarea id="motivo" rows="4" required placeholder="Descreva brevemente o assunto..."></textarea>
  <label for="data">Data desejada:</label><input type="date" id="data" required>
  <label for="horario">Horário:</label><select id="horario" required><option value="">Selecione uma data primeiro</option></select>
  <h4>Caso o horário que você quer não está disponivel, então ligue para: (11) 4445-9200</h4>
  <button type="submit">Confirmar atendimento</button><div id="mensagem"></div>
  </form><hr><button type="button" onclick="location.href='/cidadao.html'">Voltar</button>
</div>


<script>
const dataInput = document.getElementById('data');
const horarioSelect = document.getElementById('horario');
const motivoInput = document.getElementById('motivo');
const formAgendamento = document.getElementById('formAgendamento');
const mensagemEl = document.getElementById('mensagem');

  const [ano, mes, dia] = String(dataIso).slice(0, 10).split('-');
  const data = new Date(Date.UTC(Number(ano), Number(mes) - 1, Number(dia)));

  return data.toLocaleDateString('pt-BR', {
    timeZone: 'UTC',
    weekday: 'short', // ex: "qua."
    day: '2-digit',   // ex: "11"
    month: 'short',   // ex: "nov."
    year: 'numeric'   // ex: "2026"
  });

};
const formatarHorario = (v) => {
  if (!v) return '';
  // Se for uma string ISO ('1970-01-01T11:00:00.000Z'), isola o '11:00'
  if (String(v).includes('T')) {
    return String(v).split('T')[1].slice(0, 5);
  }
  return String(v).slice(0, 5);
};

function preencher(h) {
  if (!horarioSelect) return;
  horarioSelect.innerHTML = '<option value="">Selecione um horário</option>' + 
    h.map(x => `<option value="${x}">${x}</option>`).join('');
}

async function carregarConta() {
  try {
    const r = await fetch('/api/cidadao/me');
    if (r.status === 401) {
      location.href = '/';
      return false;
    }
    const x = await r.json();
    if (!r.ok) {
      alert(x.mensagem || 'Não foi possível carregar sua conta.');
      return false;
    }
    document.getElementById('boasVindas').textContent = 
      `Olá, ${x.cidadao.nome}. Escolha somente a data e o horário do atendimento.`;
    return true;
  } catch (e) {
    console.error('Erro ao carregar conta:', e);
    return false;
  }
}

async function atualizar() {
  if (!dataInput?.value) return;

  const [ano, mes, dia] = dataInput.value.split('-').map(Number);
  const d = new Date(ano, mes - 1, dia);

  // 0 = Domingo, 6 = Sábado
  if ([0, 6].includes(d.getDay())) {
    alert('Atendimento apenas em dias úteis.');
    dataInput.value = '';
    preencher([]);
    return;
  }

  try {
    const r = await fetch('/api/agendamentos/disponiveis?data=' + encodeURIComponent(dataInput.value));
    const x = await r.json();
    if (!r.ok) throw new Error(x.mensagem || 'Erro ao carregar horários.');
    preencher(x.horariosDisponiveis || []);
  } catch (e) {
    preencher([]);
    alert(e.message);
  }
}

dataInput?.addEventListener('change', atualizar);

formAgendamento?.addEventListener('submit', async (e) => {
  e.preventDefault();

  if (!dataInput?.value || !horarioSelect?.value) {
    return alert('Selecione a data e o horário.');
  }

  try {
    const r = await fetch('/api/agendamentos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        motivo: motivoInput?.value.trim() || '',
        data: dataInput.value,
        horario: horarioSelect.value
      })
    });

    // Se o servidor retornar HTML (ex: 404 do Express), captura como texto
    const contentType = r.headers.get('content-type') || '';
    let x = {};
    if (contentType.includes('application/json')) {
      x = await r.json();
    } else {
      const text = await r.text();
      throw new Error(`Erro no servidor (${r.status}): ${text.substring(0, 100)}`);
    }

    if (!r.ok) throw new Error(x.message || x.mensagem || 'Erro ao registrar agendamento.');

    if (mensagemEl) {
      mensagemEl.className = 'sucesso';
      mensagemEl.textContent = 'Pedido registrado com sucesso.';
    }

    formAgendamento.reset();
    preencher([]);
  } catch (e) {
    alert(e.message);
  }
});

carregarConta();
</script></body></html>
